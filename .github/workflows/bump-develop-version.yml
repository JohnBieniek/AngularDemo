name: Bump develop version

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: bump-develop-version
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether this push already updated the version
        id: version-check
        shell: bash
        run: |
          current_version="$(node -p "require('./package.json').version")"
          previous_version="$(git show HEAD^:package.json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"

          if [ "$current_version" = "$previous_version" ]; then
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Increment patch version
        if: steps.version-check.outputs.needs_bump == 'true'
        run: npm version patch --no-git-tag-version

      - name: Commit and push version update
        if: steps.version-check.outputs.needs_bump == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump develop version"
          git push origin HEAD:develop
